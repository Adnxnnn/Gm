<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070b12"><title>APEX//RUSH — 3D Street Racing</title>
<style>
:root{--cyan:#51f6ff;--pink:#ff386d;--gold:#ffd36b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050912;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#182c46 0%,#080d17 58%,#03050a 100%);text-align:center;padding:24px}#boot:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 35px,#65f4ff0a 36px 37px);pointer-events:none}.logo{font-size:clamp(40px,11vw,82px);font-weight:1000;letter-spacing:-.08em;line-height:.86;font-style:italic;text-shadow:0 0 30px #42eaff5c}.logo span{color:var(--cyan)}.sub{letter-spacing:.32em;font-size:10px;color:#a9d7e7;margin:20px 0 28px}.start{border:1px solid #7efaff;background:linear-gradient(120deg,#35d9ef,#2879c8);color:#001018;font-weight:900;letter-spacing:.16em;padding:17px 34px;border-radius:4px;box-shadow:0 0 35px #27dfff44;font-size:14px}.hint{font-size:11px;color:#a5b6c8;margin-top:18px;line-height:1.6}#hud{position:fixed;inset:0;pointer-events:none;display:none}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}.panel{background:linear-gradient(135deg,#07131bd9,#09101db8);border:1px solid #b6f8ff2e;backdrop-filter:blur(10px);padding:10px 13px;min-width:96px;box-shadow:0 5px 24px #0005}.label{font-size:9px;letter-spacing:.2em;color:#8bb8c9}.speed{font-size:32px;font-weight:900;line-height:1.1;letter-spacing:-.05em}.unit{font-size:9px;color:var(--cyan);letter-spacing:.18em}.right{text-align:right}.race-name{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--cyan)}#message{position:absolute;top:25%;width:100%;text-align:center;font-size:clamp(22px,7vw,44px);font-weight:1000;font-style:italic;letter-spacing:.08em;text-shadow:0 0 24px #32eaff;opacity:0;transition:opacity .2s}.bottom{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}.controls{display:flex;gap:12px;pointer-events:auto}.ctrl{width:64px;height:64px;border-radius:50%;border:1px solid #b6f8ff65;background:#06121cc9;color:#e8fdff;font-size:24px;font-weight:700;backdrop-filter:blur(8px);box-shadow:inset 0 0 20px #44ddff14}.ctrl:active,.ctrl.active{background:#30dff044;border-color:var(--cyan)}#nitro{width:76px;height:76px;border:1px solid #ff8aab9c;color:#fff;background:linear-gradient(135deg,#a20d3dce,#350d29df);font-size:11px;letter-spacing:.12em}#nitro strong{display:block;font-size:23px}#nitro.active{box-shadow:0 0 32px #ff286d77}#bar{height:4px;width:110px;background:#ffffff20;margin-top:8px;overflow:hidden}#fill{height:100%;width:100%;background:linear-gradient(90deg,#32eaff,#ff386d);transform-origin:left}#toast{position:absolute;top:17%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;color:#b8faff;white-space:nowrap}#pause{pointer-events:auto;border:1px solid #c2f9ff4a;background:#07131bd9;color:#fff;padding:8px 12px;font-weight:800}#end{display:none;position:fixed;inset:0;background:#030711df;z-index:30;place-items:center;text-align:center;padding:25px;backdrop-filter:blur(12px)}#end h2{font-size:42px;font-style:italic;margin:0;color:var(--cyan)}#end p{color:#c5d8e4}.small{font-size:10px;letter-spacing:.18em;color:#9bb3c6}
</style></head><body>
<div id="boot"><div><div class="logo">APEX<span>//</span><br>RUSH</div><div class="sub">NIGHT DRIVE · STREET CLASS · 01</div><button class="start" id="start">START ENGINE ↗</button><div class="hint">3D STREET RACING EXPERIENCE<br>Touch controls · Nitro boost · Endless highway<br><br>Best in landscape orientation</div></div></div>
<div id="hud"><div class="top"><div class="panel"><div class="label">VELOCITY</div><div class="speed"><span id="speed">000</span></div><div class="unit">KM/H</div></div><div class="panel right"><div class="race-name">APEX<span style="color:#fff">//</span>RUSH</div><div class="label" style="margin-top:7px">DISTANCE <b id="distance" style="color:#fff">0.00</b> KM</div><div id="bar"><div id="fill"></div></div><div class="label" style="margin-top:5px">NITRO SYSTEM</div></div></div><div id="message">NITRO BOOST</div><div id="toast">KEEP IT CLEAN. OWN THE NIGHT.</div><div class="bottom"><div class="controls"><button class="ctrl" id="left">‹</button><button class="ctrl" id="right">›</button></div><button class="ctrl" id="nitro"><strong>⚡</strong>NITRO</button></div><button id="pause" style="position:absolute;top:max(125px,calc(env(safe-area-inset-top) + 110px));right:18px">Ⅱ</button></div>
<div id="end"><div><div class="small">SESSION COMPLETE</div><h2>RUN IT BACK.</h2><p id="stats">Distance: 0 km</p><button class="start" id="again">RACE AGAIN ↗</button></div></div>
<script>
(()=>{'use strict';const boot=document.getElementById('boot'),hud=document.getElementById('hud'),start=document.getElementById('start'),end=document.getElementById('end');let THREE,scene,camera,renderer,clock,car,world=[],traffic=[],particles=[],running=false,paused=false,gameOver=false,speed=0,distance=0,nitro=100,lane=0,targetLane=0,steer=0,boost=false,score=0,raf=0;const $=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function loadThree(){return new Promise((resolve,reject)=>{if(window.THREE){resolve();return}let urls=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];let i=0;function next(){if(i>=urls.length){reject(Error('3D engine could not load. Check your internet connection.'));return}let s=document.createElement('script');s.src=urls[i++];s.onload=()=>window.THREE?resolve():next();s.onerror=next;document.head.appendChild(s)}next()})}
function mat(color,rough=.45,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}function box(w,h,d,material,x=0,y=0,z=0){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o}
function buildCar(color=0x13d9ed){const g=new THREE.Group(),paint=new THREE.MeshPhysicalMaterial({color,metalness:.78,roughness:.22,clearcoat:1,clearcoatRoughness:.12}),dark=mat(0x080d14,.25,.4),glass=new THREE.MeshPhysicalMaterial({color:0x061321,metalness:.55,roughness:.12,clearcoat:1}),rubber=mat(0x080a0d,.88),rim=mat(0x9cb8c9,.22,.9),light=new THREE.MeshBasicMaterial({color:0xb8faff}),red=new THREE.MeshBasicMaterial({color:0xff143f});g.add(box(1.8,.42,3.7,paint,0,.62,0));g.add(box(1.53,.5,1.65,glass,0,1.03,-.22));g.add(box(1.86,.1,.75,paint,0,.79,1.23));g.add(box(1.94,.1,.55,dark,0,.38,-1.58));g.add(box(1.7,.12,.35,paint,0,.91,-1.68));g.add(box(1.7,.13,.12,dark,0,1.12,-1.57));for(let x of [-.62,.62]){g.add(box(.35,.05,.68,glass,x,1.12,.25));g.add(box(.26,.05,.58,glass,x,1.12,-.58));let head=box(.44,.12,.06,light,x,.62,1.87);g.add(head);let tail=box(.42,.12,.06,red,x,.64,-1.87);g.add(tail);let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.25,24),rubber);wheel.rotation.z=Math.PI/2;wheel.position.set(x*1.37,.37,[-1.16,1.15][x>0?1:0]);g.add(wheel);let hub=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.26,16),rim);hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);g.add(hub)}let spoiler=box(1.85,.1,.22,paint,0,1.18,-1.52);g.add(spoiler);for(let x of [-.52,.52]){let glow=new THREE.PointLight(0x36eaff,1.4,7);glow.position.set(x,.5,2.1);g.add(glow)}return g}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x070d1b);scene.fog=new THREE.FogExp2(0x0a1221,.009);camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,350);camera.position.set(0,5.2,10.5);camera.lookAt(0,1,-8);renderer=new THREE.WebGLRenderer({antialias:innerWidth>700,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.shadowMap.enabled=innerWidth>700;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0x9ccfff,0x12101b,1.35));let moon=new THREE.DirectionalLight(0x94d8ff,2.2);moon.position.set(-8,15,4);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);let pink=new THREE.PointLight(0xff175b,28,65);pink.position.set(8,7,-30);scene.add(pink);let blue=new THREE.PointLight(0x18baff,23,55);blue.position.set(-8,5,-58);scene.add(blue);
// asphalt, shoulders, guardrails and lane markings
let asphalt=mat(0x171d27,.92),shoulder=mat(0x353b46,.8),line=mat(0xc4e8ef,.5),yellow=mat(0xffc75a,.4,.1),rail=mat(0x6f8798,.28,.75);let road=box(13,.25,300,asphalt,0,-.15,-95);scene.add(road);scene.add(box(2.2,.26,300,shoulder,-7.6,-.16,-95),box(2.2,.26,300,shoulder,7.6,-.16,-95));for(let z=-240;z<25;z+=10){for(let x of [-2.15,2.15]){let stripe=box(.11,.025,4.5,line,x,-.008,z);scene.add(stripe);world.push({obj:stripe,kind:'stripe'})}for(let x of [-6.55,6.55]){let edge=box(.1,.035,300,yellow,x,.005,-95);scene.add(edge)}}for(let x of [-6.5,6.5]){let r=box(.16,.38,300,rail,x,.22,-95);scene.add(r);for(let z=-230;z<20;z+=12){scene.add(box(.18,.52,.18,rail,x,.03,z))}}
// distant skyline
for(let i=0;i<60;i++){let side=i%2?1:-1,z=-Math.random()*245,h=4+Math.random()*24,w=2+Math.random()*5;let b=box(w,h,w,mat(i%3===0?0x17273c:0x101c2c,.8,.15),side*(11+Math.random()*25),h/2-.1,z);scene.add(b);world.push({obj:b,kind:'building',side});for(let j=0;j<Math.min(12,Math.floor(h));j++){let win=new THREE.Mesh(new THREE.BoxGeometry(.08,.12,.03),new THREE.MeshBasicMaterial({color:Math.random()>.55?0x42eaff:0xffbf6b}));win.position.set(b.position.x-side*(w/2+.02),.6+j*.65,z+Math.random()*w*.65);scene.add(win);world.push({obj:win,kind:'window'})}}
// street lamps, trees and neon arches
for(let z=-230;z<20;z+=18){for(let side of [-1,1]){let x=side*(8.5+Math.random()*1.3);let pole=box(.12,4.4,.12,mat(0x4e687c,.3,.8),x,2.1,z);scene.add(pole);let arm=box(.9,.1,.12,rail,x-side*.4,4.25,z);scene.add(arm);let bulb=new THREE.PointLight(side===1?0xff3e85:0x31dfff,2.5,12);bulb.position.set(x-side*.65,4.1,z);scene.add(bulb);let lamp=new THREE.Mesh(new THREE.BoxGeometry(.35,.08,.22),new THREE.MeshBasicMaterial({color:side===1?0xff2b75:0x38efff}));lamp.position.copy(bulb.position);scene.add(lamp);world.push({obj:pole,kind:'lamp',side,z});world.push({obj:arm,kind:'lamp',side,z});world.push({obj:lamp,kind:'lamp',side,z});}}
// glowing skyline rings
for(let z=-190;z<-20;z+=55){let arch=new THREE.Mesh(new THREE.TorusGeometry(8.5,.065,8,64),new THREE.MeshBasicMaterial({color:z%2?0x26dfff:0xff2c78}));arch.position.set(0,3.7,z);scene.add(arch);world.push({obj:arch,kind:'arch'})}
car=buildCar();car.position.set(0,0,4);scene.add(car);for(let i=0;i<7;i++)spawnTraffic(-24-i*31);window.addEventListener('resize',resize);renderer.setAnimationLoop(tick)}
function spawnTraffic(z){let colors=[0xff3b65,0xffc34e,0x4e78ff,0xe4edf5,0x9b6dff];let t=buildCar(colors[Math.floor(Math.random()*colors.length)]);t.scale.setScalar(.82);t.position.set([-4.3,0,4.3][Math.floor(Math.random()*3)],0,z);scene.add(t);traffic.push({obj:t,z,lane:t.position.x,spd:12+Math.random()*18,phase:Math.random()*6})}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<500?68:62;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.shadowMap.enabled=innerWidth>700}
function moveLane(d){targetLane=clamp(targetLane+d,-1,1);$('left').classList.toggle('active',d<0);$('right').classList.toggle('active',d>0);setTimeout(()=>{$('left').classList.remove('active');$('right').classList.remove('active')},130)}
function bindHold(id,fn,up){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('active');fn()});for(let ev of ['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,e=>{el.classList.remove('active');if(up)up()})}bindHold('left',()=>moveLane(-1));bindHold('right',()=>moveLane(1));bindHold('nitro',()=>boost=true,()=>boost=false);$('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('toast').textContent=paused?'PAUSED — TAP PLAY TO CONTINUE':'KEEP IT CLEAN. OWN THE NIGHT.'});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')moveLane(-1);if(e.key==='ArrowRight'||e.key==='d')moveLane(1);if(e.code==='Space')boost=true});document.addEventListener('keyup',e=>{if(e.code==='Space')boost=false});let sx=0;document.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>55)moveLane(dx>0?1:-1)},{passive:true});
function tick(){if(!renderer||!scene)return;if(!running||paused||gameOver){renderer.render(scene,camera);return}let dt=Math.min(clock.getDelta(),.04);let desired=boost&&nitro>0?48:31;speed+=(desired-speed)*dt*1.15;if(boost&&nitro>0)nitro=Math.max(0,nitro-24*dt);else nitro=Math.min(100,nitro+7*dt);let move=(speed/3.6)*dt;distance+=move/1000;score+=move;car.position.x+=(targetLane*4.3-car.position.x)*Math.min(1,dt*7);car.rotation.z+=(targetLane*-.055-car.rotation.z)*Math.min(1,dt*5);car.position.y=Math.sin(performance.now()*.012)*.012;camera.position.x+=(car.position.x*.22-camera.position.x)*dt*2.4;camera.position.y=5.15+Math.sin(performance.now()*.0017)*.05+(boost?.13:0);camera.position.z=10.5+(boost?-.6:0);camera.lookAt(car.position.x*.35,1.0,-8);scene.fog.density=boost?.011:.009;
for(let o of world){let p=o.obj.position;p.z+=move;if(p.z>18){p.z-=250;if(o.kind==='building')p.x=o.side*(11+Math.random()*25);if(o.kind==='arch')p.z=-180-Math.random()*35}}
for(let t of traffic){t.z+=move-t.spd*dt*.36;t.obj.position.z=t.z;t.obj.position.x=t.lane+Math.sin(performance.now()*.0007+t.phase)*.12;if(t.z>11){t.z=-180-Math.random()*65;t.obj.position.z=t.z;t.lane=[-4.3,0,4.3][Math.floor(Math.random()*3)];t.obj.position.x=t.lane;t.spd=12+Math.random()*18}if(Math.abs(t.z-car.position.z)<2.8&&Math.abs(t.obj.position.x-car.position.x)<1.65){speed*=.78;nitro=Math.max(0,nitro-8);$('toast').textContent='IMPACT DETECTED · RECOVER';setTimeout(()=>$('toast').textContent='KEEP IT CLEAN. OWN THE NIGHT.',900)}}
$('speed').textContent=String(Math.round(speed*3.6)).padStart(3,'0');$('distance').textContent=distance.toFixed(2);$('fill').style.transform=`scaleX(${nitro/100})`;if(boost&&nitro>0){$('message').style.opacity='1';$('message').textContent='NITRO BOOST'}else $('message').style.opacity='0';renderer.render(scene,camera)}
start.addEventListener('click',async()=>{start.disabled=true;start.textContent='IGNITING ENGINE…';try{await loadThree();init();boot.style.display='none';hud.style.display='block';running=true;speed=0;distance=0;nitro=100;clock.start()}catch(e){start.disabled=false;start.textContent='RETRY ENGINE ↗';document.querySelector('.hint').textContent='Could not load the 3D engine. Check internet and tap retry.';console.error(e)}});$('again').addEventListener('click',()=>{end.style.display='none';speed=0;distance=0;nitro=100;targetLane=0;car.position.x=0;traffic.forEach((t,i)=>{t.z=-24-i*31;t.obj.position.z=t.z});gameOver=false;paused=false;running=true;clock.start()});
// Pause button double-tap is not required; session stays endless. Hide HUD cleanly when page backgrounds.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;$('pause').textContent='▶'}});
})();
</script></body></html>
